server:
  port: 3001

spring:
  application:
    name: products-inventory
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://admin_123:nhRb9NllTbzdEhuc@neweraproducts.wige5q7.mongodb.net/productsInventory?retryWrites=true&w=majority&appName=NewEraProducts}
